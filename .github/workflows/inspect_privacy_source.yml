name: Inspect Privacy Source

on:
  push:
    branches: [dev/2.2.2-privacy]
    paths: [".github/workflows/inspect_privacy_source.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 2.2.1 and inspect
        shell: bash
        run: |
          cat source_final/PostalScanner.py.gz.b64.part* | tr -d '\r\n' | base64 -d > /tmp/ps.gz
          gzip -dc /tmp/ps.gz > src/PostalScanner.py
          python dev/patch_221.py
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path('src/PostalScanner.py').read_text(encoding='utf-8')
          t=ast.parse(s)
          wanted={'get_general_roi','_quality_roi','rectify_document','detect_document_corners','scan_rect'}
          for node in t.body:
              if isinstance(node,(ast.Assign,ast.AnnAssign)):
                  seg=ast.get_source_segment(s,node) or ''
                  if 'PRIVACY_' in seg:
                      print('CONST',seg)
              if isinstance(node,ast.FunctionDef) and node.name in wanted:
                  print('\n###',node.name,'###\n')
                  print(ast.get_source_segment(s,node))
          PY

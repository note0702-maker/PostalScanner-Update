name: Inspect Privacy Source

on:
  push:
    branches: [dev/2.2.2-privacy]
    paths: [".github/workflows/inspect_privacy_source.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 2.2.1 and inspect
        shell: bash
        run: |
          cat source_final/PostalScanner.py.gz.b64.part* | tr -d '\r\n' | base64 -d > /tmp/ps.gz
          gzip -dc /tmp/ps.gz > src/PostalScanner.py
          python dev/patch_221.py
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path('src/PostalScanner.py').read_text(encoding='utf-8')
          t=ast.parse(s)
          top_names={'_privacy_assert_external_image','_resize_for_openai','_jpeg_data_url','_call_openai_vision','recognize_general_openai','recognize_ledger_openai','scan_rect','api_capture_quality_check'}
          method_names={'capture_best_frame','start_scan','scan_worker','update_camera','process_ui_queue'}
          for node in t.body:
              if isinstance(node, ast.FunctionDef) and node.name in top_names:
                  print('\n### TOP',node.name,'###\n')
                  print(ast.get_source_segment(s,node))
              if isinstance(node, ast.ClassDef):
                  for c in node.body:
                      if isinstance(c, ast.FunctionDef) and c.name in method_names:
                          print('\n### METHOD',c.name,'###\n')
                          print(ast.get_source_segment(s,c))
          PY

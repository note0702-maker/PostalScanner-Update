name: PostalScanner 2.2.3 Preserved UI Build v3

on:
  push:
    branches: [dev/2.2.3-ledger-excel-preserve]
    paths:
      - ".github/workflows/build_223_preserve_v3.yml"
      - "dev/run_patch_223_robust.py"
      - "dev/patch_223_ledger_excel.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller pywin32 opencv-python numpy pillow

      - name: Reconstruct production source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source_final/PostalScanner.py.gz.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 source parts" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("PostalScanner.final.py.gz", [Convert]::FromBase64String($b64))
          python -c "import gzip,pathlib; pathlib.Path('src/PostalScanner.py').write_bytes(gzip.decompress(pathlib.Path('PostalScanner.final.py.gz').read_bytes()))"
          python dev/patch_221.py
          python dev/patch_222_privacy.py

      - name: Normalize prompt assignment without changing UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import ast
          p=Path('src/PostalScanner.py'); s=p.read_text(encoding='utf-8'); tree=ast.parse(s)
          node=None
          for x in tree.body:
              if isinstance(x,(ast.Assign,ast.AnnAssign)):
                  ts=x.targets if isinstance(x,ast.Assign) else [x.target]
                  if any(isinstance(t,ast.Name) and t.id=='OPENAI_LEDGER_PROMPT' for t in ts): node=x; break
          if node is None: raise SystemExit('ledger prompt not found')
          lines=s.splitlines(); lines[node.lineno-1:node.end_lineno]=['OPENAI_LEDGER_PROMPT = r"""temporary ledger prompt anchor"""']
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          '@ | Set-Content normalize.py -Encoding utf8
          python normalize.py

      - name: Apply surgical 2.2.3 patch
        shell: pwsh
        run: python dev/run_patch_223_robust.py

      - name: Compile and test preservation
        shell: pwsh
        run: |
          python -m py_compile src/PostalScanner.py src/postal_rules.py src/PostalScanner_Updater.py
          $env:PYTHONPATH = "."
          python -m pytest -q tests/test_rules.py tests/test_updater.py tests/test_222_privacy_contract.py tests/test_223_preservation_contract.py
          @'
          from pathlib import Path
          import ast
          s=Path('src/PostalScanner.py').read_text(encoding='utf-8')
          req=['APP_VERSION = "2.2.3"','PERSISTENT_ROOT = get_persistent_root()','DATA_DIR = PERSISTENT_ROOT / "data"','OPENAI_SECURE_KEY_FILE = DATA_DIR / "openai_key.dat"','def open_management(self):','PRIVACY_MAX_EXTERNAL_RATIO_LEDGER = 0.58','"store": False','def _build_ledger_focus_image(','def _apply_postal_excel_display(','address_range.HorizontalAlignment = -4131','recipient_cell.ShrinkToFit = True']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Missing preserved contract: '+repr(miss))
          if 'cv2.imwrite(' in s: raise SystemExit('image disk write found')
          tree=ast.parse(s)
          migration=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name=='_copy_legacy_data_once')
          seg=ast.get_source_segment(s,migration) or ''
          if any(x in seg for x in ('shutil.move','.unlink(','rmtree')): raise SystemExit('destructive migration found')
          print('2.2.3 PRESERVATION CONTRACT PASS')
          '@ | Set-Content verify.py -Encoding utf8
          python verify.py

      - name: Version info
        shell: pwsh
        run: |
          @'
          VSVersionInfo(ffi=FixedFileInfo(filevers=(2,2,3,0),prodvers=(2,2,3,0),mask=0x3f,flags=0x0,OS=0x40004,fileType=0x1,subtype=0x0,date=(0,0)),kids=[StringFileInfo([StringTable('040904B0',[StringStruct('CompanyName','PostalScanner'),StringStruct('FileDescription','PostalScanner - 개인정보보호 인감대장 인식 강화'),StringStruct('FileVersion','2.2.3'),StringStruct('InternalName','PostalScanner'),StringStruct('OriginalFilename','PostalScanner.exe'),StringStruct('ProductName','PostalScanner'),StringStruct('ProductVersion','2.2.3')])]),VarFileInfo([VarStruct('Translation',[0x0409,1200])])])
          '@ | Set-Content version_info.txt -Encoding utf8

      - name: Build EXEs
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --noupx --name PostalScanner --version-file version_info.txt --paths src --exclude-module paddleocr --exclude-module paddlex --exclude-module paddle --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32com --hidden-import win32com.client --hidden-import win32crypt src/PostalScanner.py
          python -m PyInstaller --noconfirm --clean --windowed --onedir --noupx --name PostalScanner_Updater --version-file version_info.txt src/PostalScanner_Updater.py
          New-Item -ItemType Directory -Force dist/PostalScanner/updater | Out-Null
          Copy-Item dist/PostalScanner_Updater/* dist/PostalScanner/updater/ -Recurse -Force
          @'
          PostalScanner 2.2.3 PRESERVED UI HOTFIX
          - 2.2.2 Management/Settings UI preserved
          - LocalAppData data/API-key/settings architecture preserved
          - ledger last-written-row recognition strengthened
          - Excel address left-align + shrink-to-fit; recipient shrink-to-fit
          - privacy store=false / no image disk write / no full-frame fallback preserved
          '@ | Set-Content dist/PostalScanner/RELEASE_NOTES.txt -Encoding utf8

      - name: Validate and package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/PostalScanner/PostalScanner.exe)) { throw "main EXE missing" }
          if (-not (Test-Path dist/PostalScanner/updater/PostalScanner_Updater.exe)) { throw "updater EXE missing" }
          Compress-Archive -Path dist/PostalScanner -DestinationPath PostalScanner_2.2.3_PRESERVED_BASE.zip -CompressionLevel Optimal -Force
          Get-FileHash PostalScanner_2.2.3_PRESERVED_BASE.zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: PostalScanner_2.2.3_PRESERVED_BASE
          path: PostalScanner_2.2.3_PRESERVED_BASE.zip
          retention-days: 14

name: PostalScanner Legacy Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Manual legacy release only"
        required: false
        type: string

permissions:
  contents: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow notice
        run: |
          echo "This legacy release workflow is manual-only."
          echo "Use the current version-specific release workflow for production releases."
